# Render Blueprint — API only. The Vite UI lives on Vercel.
# https://render.com/docs/blueprint-spec
#
# Runtime is ONNX Runtime, not PyTorch. Starter (512 MB) can run detect;
# Standard is still nicer if the box is also serving extract + geocode.

services:
  - type: web
    name: skyeye-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: YOLO_DEVICE
        value: cpu
      - key: YOLO_WEIGHTS
        value: /app/yolov8n.onnx
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
